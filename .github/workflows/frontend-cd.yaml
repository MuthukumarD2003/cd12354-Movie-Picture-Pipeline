name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-cd
  cancel-in-progress: false

env:
  CI: "true"
  REACT_APP_MOVIE_API_URL: "http://localhost:5000"
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  EKS_CLUSTER_NAME: cluster

defaults:
  run:
    shell: bash
    working-directory: starter/frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: starter/frontend/.nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: starter/frontend/.nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --watchAll=false

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - lint
      - test
    if: github.ref == 'refs/heads/main'

    env:
      REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check backend URL
        run: |
          if [[ -z "$REACT_APP_MOVIE_API_URL" ]]; then
            echo "::error::Set the REACT_APP_MOVIE_API_URL repository secret before deploying."
            exit 1
          fi

          case "$REACT_APP_MOVIE_API_URL" in
            http://localhost*|https://localhost*|http://127.*|https://127.*)
              echo "::error::Use the public backend LoadBalancer URL."
              exit 1
              ;;
            http://*|https://*)
              ;;
            *)
              echo "::error::Backend URL must start with http:// or https://."
              exit 1
              ;;
          esac

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "${REACT_APP_MOVIE_API_URL%/}/movies" \
            --output /dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL%/}" \
            --tag "$IMAGE_URI" \
            .

          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build

    env:
      IMAGE_URI: ${{ needs.build.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install kubectl for Kubernetes 1.35
        run: |
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable-1.35.txt)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.x"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Apply the new frontend image
        working-directory: starter/frontend/k8s
        run: |
          test -n "$IMAGE_URI"
          kustomize edit set image "frontend=$IMAGE_URI"
          kustomize build . | kubectl apply -f -

      - name: Verify frontend rollout
        run: |
          kubectl rollout status deployment/frontend --namespace default --timeout=300s
          kubectl get deployment frontend --namespace default -o wide
          kubectl get service frontend --namespace default -o wide